openapi: 3.1.0
info:
  version: 1.0.0
  title: Node.js API
  description: API do obsługi kontaktów z wykorzystaniem MongoDB i Swagger UI
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
servers:
  - url: http://localhost:3000
  - url: https://twoja-aplikacja.onrender.com
tags:
  - name: Contacts
    description: Operacje związane z kontaktami
paths:
  /contacts:
    get:
      $ref: '#/components/schemas/Contact'
    post:
      $ref: '#/components/schemas/Contact'
  /contacts/{contactId}:
    get:
      $ref: '#/components/schemas/Contact'
    patch:
      $ref: '#/components/schemas/Contact'
    delete:
      $ref: '#/components/schemas/Contact'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Contact:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        phone:
          type: string
