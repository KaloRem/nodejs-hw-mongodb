openapi: 3.1.0
info:
  version: 1.0.0
  title: Node.js API
  description: API do obsługi kontaktów z wykorzystaniem MongoDB i Swagger UI
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html

servers:
  - url: http://localhost:3000
    description: Lokalny serwer
  - url: https://nodejs-hw-mongodb-swagger-8jd1.onrender.com
    description: Serwer produkcyjny

tags:
  - name: Contacts
    description: Operacje związane z kontaktami

paths:
  /contacts:
    get:
      $ref: ../swagger/paths/contacts/get.yaml
    post:
      $ref: ../swagger/paths/contacts/post.yaml

  /contacts/{contactId}:
    get:
      $ref: ../swagger/paths/contacts/get_contactId.yaml
    patch:
      $ref: ../swagger/paths/contacts/patch_contactId.yaml
    delete:
      $ref: ../swagger/paths/contacts/delete_contactId.yaml

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    $ref: '../swagger/components/schemas.yaml'
