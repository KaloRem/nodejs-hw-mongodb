openapi: 3.1.0
info:
  version: 1.0.0
  title: Node.js API
  description: API do obsługi kontaktów z wykorzystaniem MongoDB i Swagger UI
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html

servers:
  - url: http://localhost:3000
  - url: https://nodejs-hw-mongodb-swagger-8jd1.onrender.com

tags:
  - name: Contacts
    description: Operacje związane z kontaktami

paths:
  /contacts:
    get:
      $ref: ../swagger/paths/contacts/get.yaml
    post:
      $ref: ../swagger/paths/contacts/post.yaml

  /contacts/{contactId}:
    get:
      $ref: ../swagger/paths/contacts/get_{contactId}.yaml
    patch:
      $ref: ../swagger/paths/contacts/patch_{contactId}.yaml
    delete:
      $ref: ../swagger/paths/contacts/delete_{contactId}.yaml

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Contact:
      $ref: '../swagger/components/schemas.yaml#/Contact'
