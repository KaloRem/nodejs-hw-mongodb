openapi: 3.1.0
info:
  version: 1.0.0
  title: Contacts Manager App
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  description: Contacts operations

tags:
  - name: Contacts
    description: Operations with contacts

servers:
  - url: http://localhost:3000
    description: Lokalny serwer
  - url: https://nodejs-hw-mongodb-swagger-8jd1.onrender.com
    description: Serwer produkcyjny

paths:
  /contacts:
    get:
      $ref: '../swagger/paths/contacts/get.yaml'
    post:
      $ref: '../swagger/paths/contacts/post.yaml'
  /contacts/{id}:
    get:
      $ref: '../swagger/paths/contacts/{id}/get.yaml'
    patch:
      $ref: '../swagger/paths/contacts/{id}/patch.yaml'
    delete:
      $ref: '../swagger/paths/contacts/{id}/delete.yaml'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Contact:
      $ref: '../swagger/components/schemas/contact.yaml'
