type: object
required:
  - _id
  - name
  - phoneNumber
  - email
  - isFavourite
  - contactType
properties:
  _id:
    description: "Contact's id"
    type: string
    example: 111111111111111111111111
  name:
    description: "Contact's name"
    type: string
    example: 'Test Test'
  phoneNumber:
    description: "Contact's number"
    type: string
    example: +38111111111
  email:
    description: "Contact's email"
    type: string
    example: test@gmail.com
  isFavourite:
    description: 'Whether the contact is favorite or not'
    type: boolean
    example: true
  contactType:
    description: "Contact's type"
    type: string
    enum: ['personal', 'home', 'work']
  photo:
    description: "Link to contact's photo"
    type: string
    example: https://res.cloudinary.com/111111111/image/upload/v1111111111111111111111111111111.jpg
