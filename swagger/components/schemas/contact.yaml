type: object
required:
  - _id
  - name
  - phoneNumber
  - isFavourite
  - contactType
properties:
  _id:
    description: "Contact's id"
    type: string
    example: 67bb2094b5984df975b326ad
  name:
    description: "Contact's name"
    type: string
    example: 'Bogdan Paslawski'
  phoneNumber:
    description: "Contact's number"
    type: string
    example: +380000000000
  email:
    description: "Contact's email (optional)"
    type: string
    example: bogdan.paslawskii@gmail.com
  isFavourite:
    description: 'Whether the contact is favorite or not'
    type: boolean
    example: true
  contactType:
    description: "Contact's type"
    type: string
    enum: ['personal', 'home', 'work']
  photo:
    description: "Link to contact's photo (optional)"
    type: string
    format: binary
    example: https://res.cloudinary.com/dihpekuis/image/upload/v1739793134/contacts/xc3p6tq8wlverbybdnxx.jpg
