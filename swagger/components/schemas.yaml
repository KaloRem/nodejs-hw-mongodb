schemas:
  Contact:
    type: object
    properties:
      id:
        type: string
        description: Unikalny identyfikator kontaktu
      name:
        type: string
        description: Imię i nazwisko kontaktu
      email:
        type: string
        format: email
        description: Adres e-mail kontaktu
      phone:
        type: string
        description: Numer telefonu kontaktu
