tags:
  - Contacts
summary: Update a contact
operationId: updateContact
description: Update an existing contact's details.
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
    example: '67b322e09613d7e62762f258'
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            type: string
            example: Bogdan Paslawski
          phoneNumber:
            type: string
            example: +380000000000
          email:
            type: string
            example: bogdan.paslawskii@gmail.com
          contactType:
            type: string
            enum: ['work', 'personal', 'home']
            example: home
          isFavourite:
            type: boolean
            example: false
          photo:
            type: string
            format: binary
            example: 'https://res.cloudinary.com/dihpekuis/image/upload/v1739793134/contacts/xc3p6tq8wlverbybdnxx.jpg'
        required: []

responses:
  '200':
    description: Contact successfully updated
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'Contact successfully updated!'
            data:
              type: object
              $ref: ../../../components/schemas/contact.yaml
  '400':
    $ref: ../../../components/responses/400.yaml
  '404':
    $ref: ../../../components/responses/404.yaml
  '401':
    $ref: ../../../components/responses/401.yaml
  '500':
    $ref: ../../../components/responses/500.yaml
