tags:
  - Contacts
summary: Create a new contact
operationId: createContact
description: Add a new contact to the list.
security:
  - bearerAuth: []
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
          - contactType
        properties:
          name:
            description: Contact name
            type: string
            example: 'Bogdan Paslawski'
          phoneNumber:
            description: Contact phone
            type: string
            example: '+380000000000'
          email:
            description: Contact email address (optional)
            type: string
            example: bogdan.paslawskii@gmail.com
          contactType:
            description: 'Contact type'
            enum: ['work', 'personal', 'home']
          isFavourite:
            description: 'Is this contact a favorite?'
            type: boolean
            example: false
          photo:
            description: 'Profile photo of contact (optional)'
            type: string
            format: binary
            example: 'https://res.cloudinary.com/dihpekuis/image/upload/v1739793134/contacts/xc3p6tq8wlverbybdnxx.jpg'

responses:
  '201':
    description: Successfully created a new contact
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: '201'
            message:
              type: string
              example: Successfully created a contact
            data:
              type: object
              $ref: '../../components/schemas/contact.yaml'
  '401':
    $ref: ../../components/responses/401.yaml
  '400':
    $ref: ../../components/responses/400.yaml
  '500':
    $ref: ../../components/responses/500.yaml
